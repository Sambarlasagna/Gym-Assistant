<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalized Gym Management System</title>
    <link rel="stylesheet" href="assets/global.css">
    <link rel="stylesheet" href="member-dashboard/member-dashboard.css">
    <link rel="stylesheet" href="workout-diet/workout-diet.css">
    <link rel="stylesheet" href="admin/admin.css">
</head>
<body>
    <script>
        const savedUser = localStorage.getItem('currentUser');
        const savedRole = localStorage.getItem('currentRole');

        if (savedUser && savedRole) {
            if (savedRole === 'member') {
                window.location.href = 'member-dashboard/dashboard.html';
            } else {
                window.location.href = 'admin/dashboard.html';
            }
        } else {
            window.location.href = 'auth/login.html';
        }
    </script>
</body>
</html>
